<!DOCTYPE html>
<html lang="en">

<body>
    {% extends 'base.html' %}
    {% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/dimas-jas1x12.jpg" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Birthdate</dt>
                            <dd>December 18</dd>
                        </div>
                    </dl> 
                    <div class="social-links">
                        <a href="https://github.com/dimasnbayu/" class="social-link">GitHub</a>
                        <a href="https://www.linkedin.com/in/dimas-bayu-nugroho-6a0369340/" class="social-link">LinkedIn</a>
                        <a href="mailto:dimas.bayu51@ui.ac.id" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
    {% endblock content %}
</body>
</html>
